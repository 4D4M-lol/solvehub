{% extends "base.html" %}

{% block title %}Sign Up | SolveHub{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <div class="auth-icon">
            <i data-lucide="user-plus"></i>
        </div>

        <h1>Create an account</h1>

        <p class="auth-subtitle">
            Join the SolveHub community.
        </p>


        <form method="POST">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Choose a username"
                required
            >


            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Create a password"
                required
            >


            <button type="submit" class="primary-button">
                Sign Up
            </button>

        </form>


        <p class="auth-footer">
            Already have an account?
            <a href="{{ url_for('auth.login') }}">Log In</a>
        </p>

    </div>

</div>

{% endblock %}
